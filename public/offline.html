<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Descolgá — sin conexión</title>
    <style>
      :root {
        --bg: #161826;
        --text: #e9e9ed;
        --muted: #b2b6ca;
        --accent: #9184d9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 32px 28px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 14px var(--accent);
      }
      h1 { font-size: 23px; font-weight: 500; letter-spacing: -0.015em; margin: 8px 0 0; }
      p { margin: 0; color: var(--muted); max-width: 32ch; text-wrap: pretty; }
      button {
        align-self: flex-start;
        margin-top: 12px;
        font: inherit;
        font-size: 14px;
        color: var(--accent);
        background: transparent;
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <span class="dot"></span>
    <h1>Te quedaste sin conexión</h1>
    <p>Los avisos siguen saliendo del servidor, así que no vas a perder nada. Reintentá cuando vuelva la red.</p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
